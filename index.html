<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>パスワードが必要です</title>
<style>
:root{--bg:#f6f5f1;--surface:#fcfcfb;--text:#0b0b0b;--text-2:#52514e;--line:#e2e0d9;--accent:#2a78d6;--err:#c94a1c}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--surface:#1a1a19;--text:#f0efec;--text-2:#c3c2b7;--line:#33322f;--accent:#3987e5;--err:#e8774a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:min(100%,360px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px}
h1{font-size:1.1rem;margin:0 0 6px}
p{margin:0 0 16px;color:var(--text-2);font-size:.9rem;line-height:1.6}
label{display:block;font-size:.85rem;color:var(--text-2);margin-bottom:6px}
input{width:100%;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{margin-top:12px;width:100%;font-size:1rem;font-weight:700;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.rem{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:.85rem;color:var(--text-2)}
.rem input{width:auto;margin:0}
[hidden]{display:none!important}
#msg{min-height:1.4em;margin:10px 0 0;font-size:.85rem;color:var(--err)}
</style>
</head>
<body>
<form id="f" autocomplete="off" hidden>
  <h1>このページは保護されています</h1>
  <p>表示するにはパスワードを入力してください。初回だけ入力すれば、この端末では次回から自動で開きます。</p>
  <label for="pw">パスワード</label>
  <input id="pw" type="password" required autofocus>
  <label class="rem"><input type="checkbox" id="rem" checked> この端末では次回から入力しない</label>
  <button id="b" type="submit">開く</button>
  <div id="msg" role="alert"></div>
</form>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const e64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const SK='hifuyou-key-'+P.s;
const store={get(){try{return localStorage.getItem(SK)}catch(e){return null}},set(v){try{localStorage.setItem(SK,v)}catch(e){}},del(){try{localStorage.removeItem(SK)}catch(e){}}};
async function open(key){
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},key,d(P.c)));
  document.open();document.write(html);document.close();
}
window.addEventListener('load',async()=>{
  const saved=store.get();
  if(saved&&window.crypto&&crypto.subtle){
    try{const key=await crypto.subtle.importKey('raw',d(saved),'AES-GCM',false,['decrypt']);await open(key);return;}
    catch(e){store.del();}
  }
  document.getElementById('f').hidden=false;document.getElementById('pw').focus();
});
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=document.getElementById('b'),m=document.getElementById('msg');
  if(!window.crypto||!crypto.subtle){m.textContent='このブラウザでは開けません。https のページで開いてください。';return;}
  b.disabled=true;b.textContent='確認中…';m.textContent='';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
    await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},key,d(P.c));
    if(document.getElementById('rem').checked)store.set(e64(await crypto.subtle.exportKey('raw',key)));
    await open(key);
  }catch(err){
    m.textContent='パスワードが違います。';b.disabled=false;b.textContent='開く';
  }
});
</script>
